<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niko 房源池</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f5f3ef;color:#1a1a1a;min-height:100vh}

/* Header */
header{background:#1a1a1a;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px}
.logo em{color:#c8a96e;font-style:normal}
.upload-btn{background:#c8a96e;color:#1a1a1a;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.upload-btn:hover{background:#b8986a}

/* Filter bar */
.filter-bar{background:#fff;padding:12px 24px;border-bottom:1px solid #e8e6e2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fl{font-size:11px;color:#999;letter-spacing:.3px;align-self:center}
.filter-group{display:flex;gap:5px;flex-wrap:wrap}
.pill{border:1px solid #e0e0e0;background:#fff;padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;color:#555;transition:all .15s;white-space:nowrap}
.pill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.pill:hover:not(.on){border-color:#aaa;color:#1a1a1a}
.sep{width:1px;background:#e5e5e5;height:24px;align-self:center}

/* Count bar */
.grid-container{max-width:1200px;margin:0 auto;padding:24px}
.count-bar{font-size:13px;color:#999;margin-bottom:18px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr;padding:0}}

/* Card */
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f0ede6}
.card-body{padding:14px 14px 10px}
.card-meta-top{font-size:10px;color:#aaa;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.card-title{font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cpill{background:#f5f3ef;padding:3px 9px;border-radius:4px;font-size:11px;color:#666}
.card-price{font-size:19px;font-weight:600}
.card-price sup{font-size:12px;font-weight:400;color:#999;margin-left:2px}
.card-footer{padding:9px 14px;border-top:1px solid #f0eeea;display:flex;justify-content:space-between;align-items:center}
.avail{font-size:11px;color:#aaa}
.share-btn{font-size:12px;color:#1a7340;cursor:pointer;background:none;border:none;padding:4px 8px;border-radius:4px;display:flex;align-items:center;gap:3px}
.share-btn:hover{background:#f0f8f3}

/* Empty */
.empty{text-align:center;padding:80px 24px;color:#ccc;grid-column:1/-1}
.empty div{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px;color:#bbb}

/* Upload overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 32px;width:100%;max-width:560px;position:relative;max-height:92vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:18px;padding:24px}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:2px}
.modal-sub{font-size:12px;color:#aaa;margin-bottom:16px}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;color:#bbb;cursor:pointer;line-height:1}

/* Dropzone */
.dz{border:2px dashed #ddd;border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s;background:#fafafa;margin-bottom:14px}
.dz.drag{border-color:#1a7340;background:#f2faf5}
.dz-icon{font-size:28px;margin-bottom:4px}
.dz p{color:#888;font-size:13px;margin-bottom:2px}
.dz small{color:#bbb;font-size:11px}
.dz input{display:none}

/* Card queue */
.queue{display:flex;flex-direction:column;gap:14px}
.qi{background:#f8f8f6;border-radius:14px;overflow:hidden}
.qi-top{display:flex;gap:12px;padding:12px 12px 0}
.qi-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#e8e6e0}
.qi-img-placeholder{width:80px;height:80px;border-radius:10px;background:#e8e6e0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#bbb}
.qi-header{flex:1;min-width:0}
.qi-name{font-size:13px;font-weight:500;color:#555;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-ai-btn{background:#f0faf5;color:#1a7340;border:1px solid #c8e8d4;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.qi-ai-btn:disabled{background:#f5f5f5;color:#bbb;border-color:#e5e5e5;cursor:default}
.qi-del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:0;margin-left:auto;line-height:1;flex-shrink:0}
.qi-del:hover{color:#c0392b}

/* Form inside card */
.qi-form{padding:10px 12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qf{display:flex;flex-direction:column;gap:3px}
.qf label{font-size:10px;color:#aaa;font-weight:500;letter-spacing:.3px}
.qf input,.qf select{border:1px solid #e0e0e0;border-radius:7px;padding:7px 9px;font-size:13px;background:#fff;outline:none;width:100%;-webkit-appearance:none}
.qf input:focus{border-color:#1a1a1a}
.qf-full{grid-column:1/-1}
.qi-save{grid-column:1/-1;background:#1a1a1a;color:#fff;border:none;padding:11px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;margin-top:2px}
.qi-save:hover{background:#333}

/* Action bar */
.batch-bar{margin-top:16px;display:flex;gap:8px}
.save-all-btn{background:#1a1a1a;color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;flex:1}
.save-all-btn:disabled{background:#ccc;cursor:default}
.spin{display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail page */
#detail{display:none}
#detail.on{display:block}
#pool{display:block}
#pool.off{display:none}
.detail-nav{background:#fff;padding:13px 24px;border-bottom:1px solid #e8e6e2;display:flex;align-items:center;gap:10px}
.back{background:none;border:none;font-size:14px;cursor:pointer;color:#555;display:flex;align-items:center;gap:5px}
.back:hover{color:#1a1a1a}
.dc{max-width:540px;margin:0 auto;padding:24px}
.dc-img{width:100%;border-radius:14px;margin-bottom:18px;display:block}
.dc-label{font-size:11px;color:#aaa;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.dc-title{font-size:26px;font-weight:500;margin-bottom:6px;line-height:1.2}
.dc-addr{color:#aaa;font-size:13px;margin-bottom:22px}
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.dc-meta{background:#f5f3ef;border-radius:10px;padding:13px}
.dc-meta .k{font-size:11px;color:#aaa;margin-bottom:3px}
.dc-meta .v{font-size:15px;font-weight:500}
.dc-price{font-size:34px;font-weight:600;margin-bottom:4px}
.dc-monthly{font-size:13px;color:#aaa;margin-bottom:20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tag{background:#f0eeea;padding:6px 13px;border-radius:20px;font-size:13px;color:#555}
.share-big{background:#1a7340;color:#fff;border:none;padding:15px;border-radius:12px;font-size:14px;cursor:pointer;width:100%;font-weight:500}
.share-big:hover{background:#155a30}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>

async function loadData() {
  props = INLINE_LISTINGS;
  const local = JSON.parse(localStorage.getItem('niko-pool') || '[]');
  props = [...local, ...props];
  render();
}

function getFiltered() {
  return props.filter(p => {
    if (F.zone !== 'all' && String(p.zone) !== F.zone) return false;
    if (F.beds !== 'all') {
      const b = parseInt(F.beds);
      if (b === 3 && p.beds < 3) return false;
      if (b < 3 && p.beds !== b) return false;
    }
    if (F.price !== 'all') {
      const w = p.weekly || 0;
      if (F.price === 'low' && w > 700) return false;
      if (F.price === 'mid' && (w < 700 || w > 1000)) return false;
      if (F.price === 'high' && w < 1000) return false;
    }
    return true;
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('count-bar').textContent = `共 ${list.length} 套房源`;
  const g = document.getElementById('card-grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty"><div>🏠</div><p>暂无符合条件的房源</p></div>';
    return;
  }
  g.innerHTML = list.map(p => {
    const img = (p.images && p.images[0]) ? p.images[0] : p.imageDataUrl;
    const beds = p.bed_label || (p.beds === 0 ? 'Studio' : p.beds + ' Bed');
    return `<div class="card" onclick="showDetail('${p.id}')">
      ${img ? `<img class="card-img" src="${img}" loading="lazy" onerror="this.style.display='none'">` : '<div class="card-img"></div>'}
      <div class="card-body">
        <div class="card-meta-top">${p.postcode || ''} &middot; Zone ${p.zone || 2}</div>
        <div class="card-title">${p.title || p.id}</div>
        <div class="card-pills">
          <span class="cpill">${beds}</span>
          ${p.furnish ? `<span class="cpill">${p.furnish}</span>` : ''}
          ${p.avail ? `<span class="cpill">${p.avail}</span>` : ''}
        </div>
        <div class="card-price">£${(p.weekly||0).toLocaleString()}<sup>/周</sup></div>
      </div>
      <div class="card-footer">
        <span class="avail">约 £${(p.monthly||Math.round((p.weekly||0)*52/12)).toLocaleString()}/月</span>
        <button class="share-btn" onclick="event.stopPropagation();share('${p.id}')">↗ 分享</button>
      </div>
    </div>`;
  }).join('');
}

}

// ── API KEY ──────────────────────────────────────────────
function getApiKey() { return localStorage.getItem('claude-api-key') || ''; }

// ── CLAUDE VISION API ────────────────────────────────────
async function analyzeCard(dataUrl) {
  const key = getApiKey();
  if (!key) throw new Error('NO_KEY');
  const mime = dataUrl.split(';')[0].split(':')[1];
  const b64  = dataUrl.split(',')[1];
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-allow-browser': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mime, data: b64 } },
          { type: 'text', text: `This is a UK property listing card. Return ONLY a JSON object:\n{"title":"address/name","postcode":"UK prefix e.g. N1C","beds":2,"weekly":900,"avail":"DD/MM/YYYY or Now","furnish":"带家具 or 不带家具","features":["feature1"]}` }
        ]
      }]
    })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${resp.status}`); }
  const d = await resp.json();
  const m = d.content[0].text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('解析失败');
  return JSON.parse(m[0]);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1024;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
          else       { w = Math.round(w*MAX/h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  arr.forEach(file => {
    const id = 'q' + Date.now() + Math.random().toString(36).slice(2,6);
    const objectUrl = URL.createObjectURL(file);
    batchQueue.push({ id, file, objectUrl, dataUrl: null, status: 'wait',
      data: { title:'', postcode:'', zone:2, beds:2, weekly:'', avail:'', furnish:'带家具', features:[] }
    });
  });
  renderQueue();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function updateQ(id, key, val) {
  const q = batchQueue.find(x=>x.id===id);
  if (!q) return;
  q.data[key] = val;
  if (key==='postcode') { q.data.zone = zone4pc(val); updateQField(id,'zone',q.data.zone); }
}
function updateQField(id, key, val) {
  // Update just a single field DOM without full re-render
  const el = document.querySelector(`#${id} [data-key="${key}"]`);
  if (el) el.value = val;
}

function removeQ(id) {
  const q = batchQueue.find(x=>x.id===id);
  if (q && q.objectUrl) URL.revokeObjectURL(q.objectUrl);
  batchQueue = batchQueue.filter(x=>x.id!==id);
  const el = document.getElementById(id);
  if (el) el.remove();
  document.getElementById('batch-bar').style.display = batchQueue.length ? 'flex' : 'none';
}

async function aiRecognize(id) {
  const q = batchQueue.find(x=>x.id===id);
  if (!q) return;
  if (!getApiKey()) {
    const key = prompt('请输入 Anthropic API Key (sk-ant-...)');
    if (!key) return;
    localStorage.setItem('claude-api-key', key);
  }
  const btn = document.querySelector(`#${id} .qi-ai-btn`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin">⟳</span> 识别中'; }
  try {
    const compressed = await compressImage(q.file);
    q.dataUrl = compressed;
    const result = await analyzeCard(compressed);
    result.zone = zone4pc(result.postcode || '');
    q.data = { ...q.data, ...result };
    // Fill in the form fields
    const card = document.getElementById(id);
    if (card) {
      ['title','postcode','weekly','avail'].forEach(k => {
        const el = card.querySelector(`[data-key="${k}"]`);
        if (el && result[k]) el.value = result[k];
      });
      ['zone','beds','furnish'].forEach(k => {
        const el = card.querySelector(`[data-key="${k}"]`);
        if (el && result[k] != null) el.value = result[k];
      });
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '✅ 已识别'; btn.style.color='#1a7340'; }
    toast('AI 识别完成 ✓');
  } catch(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '⚡ 重新识别'; }
    toast('识别失败：' + (e.message.includes('401')?'API Key 无效':e.message.slice(0,20)));
  }
}

}

function saveSingle(id) {
  const q = batchQueue.find(x=>x.id===id);
  if (!q) return;
  const title = q.data.title || document.querySelector(`#${id} [data-key="title"]`).value.trim();
  if (!title) { toast('请填写楼盘名称'); return; }
  // Read latest values from DOM
  const card = document.getElementById(id);
  const get = k => card.querySelector(`[data-key="${k}"]`)?.value || '';
  const beds = parseInt(get('beds')) || 2;
  const weekly = parseInt(get('weekly')) || 0;
  const pc = get('postcode').toUpperCase();
  const zone = parseInt(get('zone')) || zone4pc(pc);
  const p = {
    id: title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now(),
    title, postcode: pc, zone, weekly,
    monthly: Math.round(weekly*52/12),
    address: title + (pc?', '+pc:'') + ', London',
    bed_label: beds===0?'Studio':beds+' Bed',
    beds, avail: get('avail'), furnish: get('furnish'),
    features: q.data.features||[], images: [],
    imageDataUrl: q.dataUrl || q.objectUrl,
    uploadedAt: new Date().toISOString()
  };
  const existing = JSON.parse(localStorage.getItem('niko-pool')||'[]');
  existing.unshift(p); props.unshift(p);
  localStorage.setItem('niko-pool', JSON.stringify(existing));
  render();
  removeQ(id);
  if (!batchQueue.length) closeUpload();
  toast('已保存 ✓');
}

function saveAll() {
  const ids = [...batchQueue.map(q=>q.id)];
  ids.forEach(id => saveSingle(id));
}

// Hash routing
window.addEventListener('popstate', () => {
  const h = location.hash;
  if (h.startsWith('#/p/')) showDetail(h.slice(4));
  else showPool();
});

loadData().then(() => {
  if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
});
</script>
