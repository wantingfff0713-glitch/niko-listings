<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niko 房源池</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f5f3ef;color:#1a1a1a;min-height:100vh}

/* Header */
header{background:#1a1a1a;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px}
.logo em{color:#c8a96e;font-style:normal}
.upload-btn{background:#c8a96e;color:#1a1a1a;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.upload-btn:hover{background:#b8986a}

/* Filter bar */
.filter-bar{background:#fff;padding:12px 24px;border-bottom:1px solid #e8e6e2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fl{font-size:11px;color:#999;letter-spacing:.3px;align-self:center}
.filter-group{display:flex;gap:5px;flex-wrap:wrap}
.pill{border:1px solid #e0e0e0;background:#fff;padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;color:#555;transition:all .15s;white-space:nowrap}
.pill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.pill:hover:not(.on){border-color:#aaa;color:#1a1a1a}
.sep{width:1px;background:#e5e5e5;height:24px;align-self:center}

/* Count bar */
.grid-container{max-width:1200px;margin:0 auto;padding:24px}
.count-bar{font-size:13px;color:#999;margin-bottom:18px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr;padding:0}}

/* Card */
.card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#f0ede6}
.card-body{padding:14px 14px 10px}
.card-meta-top{font-size:10px;color:#aaa;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.card-title{font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cpill{background:#f5f3ef;padding:3px 9px;border-radius:4px;font-size:11px;color:#666}
.card-price{font-size:19px;font-weight:600}
.card-price sup{font-size:12px;font-weight:400;color:#999;margin-left:2px}
.card-footer{padding:9px 14px;border-top:1px solid #f0eeea;display:flex;justify-content:space-between;align-items:center}
.avail{font-size:11px;color:#aaa}
.share-btn{font-size:12px;color:#1a7340;cursor:pointer;background:none;border:none;padding:4px 8px;border-radius:4px;display:flex;align-items:center;gap:3px}
.share-btn:hover{background:#f0f8f3}

/* Empty */
.empty{text-align:center;padding:80px 24px;color:#ccc;grid-column:1/-1}
.empty div{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px;color:#bbb}

/* Upload overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:640px;width:96%;position:relative;max-height:92vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:500;margin-bottom:6px}
.modal-sub{font-size:12px;color:#aaa;margin-bottom:18px}
.close-x{position:absolute;top:14px;right:18px;background:none;border:none;font-size:22px;color:#bbb;cursor:pointer;line-height:1}
.close-x:hover{color:#666}

/* API key banner */
.api-banner{background:#fff8ed;border:1px solid #f5d89a;border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.api-banner input{flex:1;border:1px solid #e0d5c0;border-radius:6px;padding:7px 10px;font-size:12px;font-family:monospace;outline:none}
.api-banner input:focus{border-color:#c8a96e}
.api-save-btn{background:#c8a96e;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
.api-ok{background:#f0faf5;border:1px solid #c8e8d4;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#1a7340;display:flex;align-items:center;justify-content:space-between}
.api-change{font-size:11px;color:#aaa;cursor:pointer;text-decoration:underline}

/* Dropzone */
.dz{border:2px dashed #ddd;border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .15s;background:#fafafa}
.dz:hover,.dz.drag{border-color:#1a7340;background:#f2faf5}
.dz-icon{font-size:32px;margin-bottom:6px;color:#ccc}
.dz p{color:#aaa;font-size:13px;margin-bottom:4px}
.dz small{color:#ccc;font-size:11px}
.dz input{display:none}

/* Batch queue */
.queue{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.qi{background:#fafafa;border:1px solid #eee;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.qi-img{width:72px;height:72px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f0ede6}
.qi-body{flex:1;min-width:0}
.qi-status{font-size:11px;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.s-wait{color:#aaa}
.s-run{color:#c8a96e}
.s-done{color:#1a7340}
.s-err{color:#c0392b}
.qi-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qi-field{display:flex;flex-direction:column;gap:2px}
.qi-field label{font-size:10px;color:#bbb}
.qi-field input,.qi-field select{border:1px solid #e8e8e8;border-radius:5px;padding:5px 8px;font-size:12px;background:#fff;outline:none;width:100%}
.qi-field input:focus{border-color:#1a1a1a}
.qi-del{background:none;border:none;color:#ddd;font-size:16px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.qi-del:hover{color:#c0392b}
.qi-title-field{grid-column:1/-1}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom action bar */
.batch-bar{margin-top:16px;display:flex;gap:10px;align-items:center}
.run-btn{background:#1a7340;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500}
.run-btn:hover{background:#155a30}
.run-btn:disabled{background:#ccc;cursor:default}
.save-all-btn{background:#1a1a1a;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;flex:1}
.save-all-btn:hover{background:#333}
.save-all-btn:disabled{background:#ccc;cursor:default}
.batch-info{font-size:12px;color:#aaa}

/* Detail page */
#detail{display:none}
#detail.on{display:block}
#pool{display:block}
#pool.off{display:none}
.detail-nav{background:#fff;padding:13px 24px;border-bottom:1px solid #e8e6e2;display:flex;align-items:center;gap:10px}
.back{background:none;border:none;font-size:14px;cursor:pointer;color:#555;display:flex;align-items:center;gap:5px}
.back:hover{color:#1a1a1a}
.dc{max-width:540px;margin:0 auto;padding:24px}
.dc-img{width:100%;border-radius:14px;margin-bottom:18px;display:block}
.dc-label{font-size:11px;color:#aaa;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.dc-title{font-size:26px;font-weight:500;margin-bottom:6px;line-height:1.2}
.dc-addr{color:#aaa;font-size:13px;margin-bottom:22px}
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.dc-meta{background:#f5f3ef;border-radius:10px;padding:13px}
.dc-meta .k{font-size:11px;color:#aaa;margin-bottom:3px}
.dc-meta .v{font-size:15px;font-weight:500}
.dc-price{font-size:34px;font-weight:600;margin-bottom:4px}
.dc-monthly{font-size:13px;color:#aaa;margin-bottom:20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tag{background:#f0eeea;padding:6px 13px;border-radius:20px;font-size:13px;color:#555}
.share-big{background:#1a7340;color:#fff;border:none;padding:15px;border-radius:12px;font-size:14px;cursor:pointer;width:100%;font-weight:500}
.share-big:hover{background:#155a30}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>

async function loadData() {
  props = INLINE_LISTINGS;
  const local = JSON.parse(localStorage.getItem('niko-pool') || '[]');
  props = [...local, ...props];
  render();
}

function getFiltered() {
  return props.filter(p => {
    if (F.zone !== 'all' && String(p.zone) !== F.zone) return false;
    if (F.beds !== 'all') {
      const b = parseInt(F.beds);
      if (b === 3 && p.beds < 3) return false;
      if (b < 3 && p.beds !== b) return false;
    }
    if (F.price !== 'all') {
      const w = p.weekly || 0;
      if (F.price === 'low' && w > 700) return false;
      if (F.price === 'mid' && (w < 700 || w > 1000)) return false;
      if (F.price === 'high' && w < 1000) return false;
    }
    return true;
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('count-bar').textContent = `共 ${list.length} 套房源`;
  const g = document.getElementById('card-grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty"><div>🏠</div><p>暂无符合条件的房源</p></div>';
    return;
  }
  g.innerHTML = list.map(p => {
    const img = (p.images && p.images[0]) ? p.images[0] : p.imageDataUrl;
    const beds = p.bed_label || (p.beds === 0 ? 'Studio' : p.beds + ' Bed');
    return `<div class="card" onclick="showDetail('${p.id}')">
      ${img ? `<img class="card-img" src="${img}" loading="lazy" onerror="this.style.display='none'">` : '<div class="card-img"></div>'}
      <div class="card-body">
        <div class="card-meta-top">${p.postcode || ''} &middot; Zone ${p.zone || 2}</div>
        <div class="card-title">${p.title || p.id}</div>
        <div class="card-pills">
          <span class="cpill">${beds}</span>
          ${p.furnish ? `<span class="cpill">${p.furnish}</span>` : ''}
          ${p.avail ? `<span class="cpill">${p.avail}</span>` : ''}
        </div>
        <div class="card-price">£${(p.weekly||0).toLocaleString()}<sup>/周</sup></div>
      </div>
      <div class="card-footer">
        <span class="avail">约 £${(p.monthly||Math.round((p.weekly||0)*52/12)).toLocaleString()}/月</span>
        <button class="share-btn" onclick="event.stopPropagation();share('${p.id}')">↗ 分享</button>
      </div>
    </div>`;
  }).join('');
}

function filt(type, val, el) {
  F[type] = val;
  el.closest('.filter-group').querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');

}

async function analyzeCard(dataUrl) {
  const key = getApiKey();
  if (!key) throw new Error('NO_KEY');
  const mime = dataUrl.split(';')[0].split(':')[1];
  const b64  = dataUrl.split(',')[1];
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-allow-browser': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mime, data: b64 } },
          { type: 'text', text: `This is a UK property listing card from London agent Niko. Extract the information and return ONLY a JSON object, no other text:
{
  "title": "property name or address (e.g. 1 York Way, Kings Cross)",
  "postcode": "UK postcode prefix only (e.g. N1C, E1W, SW8, WC1B)",
  "beds": 0,
  "weekly": 0,
  "avail": "DD/MM/YYYY or Now",
  "furnish": "带家具 or 不带家具",
  "features": ["key feature 1", "key feature 2"]
}
beds: 0=Studio, 1=1 Bed, 2=2 Bed, 3=3+ Bed
weekly: weekly rent as integer number only
If a field is not visible, use empty string or 0.` }
        ]
      }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const d = await resp.json();
  const text = d.content[0].text;
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('解析失败');
  return JSON.parse(match[0]);
}

function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  arr.forEach(file => {
    const id = 'q' + Date.now() + Math.random().toString(36).slice(2);
    // Use object URL for thumbnail (works on iOS Safari, no size limit)
    const objectUrl = URL.createObjectURL(file);
    batchQueue.push({ id, file, objectUrl, dataUrl: null, status: 'wait', data: {} });
    renderQueue();
  });
}

// Compress image to max 1024px and return base64 data URL
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1024;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    }[q.status];
    // Always show fields (so user can manually fill if needed)
    const showFields = q.status !== 'run';
    const fields = showFields ? `
      <div class="qi-fields">
        <div class="qi-field qi-title-field">
          <label>楼盘名称</label>
          <input value="${esc(d.title||'')}" oninput="updateQ('${q.id}','title',this.value)" placeholder="识别后自动填入">

          <label>邮编</label>
          <input value="${esc(d.postcode||'')}" oninput="updateQ('${q.id}','postcode',this.value)" placeholder="N1C / E1W...">

        <div class="qi-field">
          <label>Zone</label>
          <select onchange="updateQ('${q.id}','zone',parseInt(this.value))">
            ${[1,2,3].map(z=>`<option value="${z}"${(d.zone||2)==z?' selected':''}>Zone ${z}</option>`).join('')}
          </select>
        </div>
        <div class="qi-field">
          <label>户型</label>
          <select onchange="updateQ('${q.id}','beds',parseInt(this.value))">
            <option value="0"${d.beds===0?' selected':''}>Studio</option>
            <option value="1"${d.beds===1?' selected':''}>1 Bed</option>

          </select>
        </div>
        <div class="qi-field">
          <label>周租 (£)</label>
          <input type="number" value="${d.weekly||''}" oninput="updateQ('${q.id}','weekly',parseInt(this.value)||0)" placeholder="0">
        </div>
        <div class="qi-field">
          <label>入住日期</label>
          <input value="${esc(d.avail||'')}" oninput="updateQ('${q.id}','avail',this.value)" placeholder="DD/MM/YYYY">
        </div>
        <div class="qi-field">
          <label>家具</label>
          <select onchange="updateQ('${q.id}','furnish',this.value)">
            <option${d.furnish!=='不带家具'?' selected':''}>带家具</option>
            <option${d.furnish==='不带家具'?' selected':''}>不带家具</option>
          </select>
        </div>
      </div>` : '<div style="color:#aaa;font-size:12px;margin-top:6px">识别中，请稍候…</div>';
    // Use objectUrl for thumbnail (avoids iOS Safari base64 size limits)
    const thumbSrc = q.objectUrl || '';
    return `<div class="qi" id="${q.id}">
      <img class="qi-img" src="${thumbSrc}" onerror="this.style.opacity='.3'">
      <div class="qi-body">
        <div class="qi-status">${statusHtml}</div>
        ${fields}
      </div>
      <button class="qi-del" onclick="removeQ('${q.id}')" title="删除">×</button>
    </div>`;
  }).join('');

  const bar = document.getElementById('batch-bar');
  bar.style.display = batchQueue.length ? 'flex' : 'none';
  const doneCount = batchQueue.filter(q=>q.status==='done').length;
  document.getElementById('batch-info').textContent = `${batchQueue.length} 张图片`;
  document.getElementById('save-all-btn').disabled = doneCount === 0;
  const running = batchQueue.some(q=>q.status==='run');
  document.getElementById('run-btn').disabled = running || batchQueue.every(q=>q.status==='done');
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function updateQ(id, key, val) {
  const q = batchQueue.find(x=>x.id===id);
  if (q) {
    q.data[key] = val;
    if (key === 'postcode') q.data.zone = zone4pc(val);
  }
}
function removeQ(id) {
  batchQueue = batchQueue.filter(x=>x.id!==id);
  renderQueue();
}

async function runBatch() {
  if (!getApiKey()) {
    toast('请先输入 Claude API Key');

    return;
  }
  const toRun = batchQueue.filter(q => q.status === 'wait' || q.status === 'err');
  if (!toRun.length) return;
  document.getElementById('run-btn').disabled = true;

  // Process in parallel (up to 3 at a time)
  const chunks = [];
  for (let i = 0; i < toRun.length; i += 3) chunks.push(toRun.slice(i, i+3));
  for (const chunk of chunks) {
    chunk.forEach(q => { q.status='run'; });
    renderQueue();
    await Promise.all(chunk.map(async q => {
      try {
        // Compress image first (iPhone photos can be 5MB+)
        const compressed = await compressImage(q.file);
        q.dataUrl = compressed; // store for saving later
        const result = await analyzeCard(compressed);
        q.data = result;
        q.data.zone = zone4pc(result.postcode || '');
        q.status = 'done';
      } catch(e) {
        q.status = 'err';
        q.errMsg = e.message.includes('NO_KEY') ? '未设置 API Key' :
                   e.message.includes('401') ? 'API Key 无效' :
                   e.message.slice(0,25);
      }
      renderQueue();
    }));
  }
  renderQueue();
}

function saveAll() {
  const done = batchQueue.filter(q => q.status === 'done' && q.data.title);
  if (!done.length) { toast('没有可保存的条目'); return; }
  const existing = JSON.parse(localStorage.getItem('niko-pool') || '[]');
  done.forEach(q => {
    const d = q.data;
    const beds = parseInt(d.beds) || 2;
    const weekly = parseInt(d.weekly) || 0;
    const pc = (d.postcode||'').toUpperCase();
    const p = {
      id: (d.title+'-'+pc).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now()+Math.random().toString(36).slice(2,5),
      title: d.title, postcode: pc,
      zone: d.zone || zone4pc(pc),
      weekly, monthly: Math.round(weekly*52/12),
      address: d.title + (pc?', '+pc:'') + ', London',
      bed_label: beds===0?'Studio':beds+' Bed',
      beds, avail: d.avail||'', furnish: d.furnish||'带家具',
      features: d.features||[], images: [], imageDataUrl: q.dataUrl,
      uploadedAt: new Date().toISOString()
    };
    existing.unshift(p);
    props.unshift(p);
  });
  localStorage.setItem('niko-pool', JSON.stringify(existing));
  render();
  closeUpload();
  toast(`已保存 ${done.length} 套房源 ✓`);
}

// Hash routing
window.addEventListener('popstate', () => {
  const h = location.hash;
  if (h.startsWith('#/p/')) showDetail(h.slice(4));
  else showPool();
});

loadData().then(() => {
  if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
});
</script>
