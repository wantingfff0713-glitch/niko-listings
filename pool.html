<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niko 房源池</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f5f3ef;color:#1a1a1a;min-height:100vh}

/* Header */
header{background:#1a1a1a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px}
.logo em{color:#c8a96e;font-style:normal}
.add-btn{background:#c8a96e;color:#1a1a1a;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

/* Filter */
.filter-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #ece9e4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{font-size:11px;color:#bbb;white-space:nowrap}
.pill{border:1.5px solid #e5e5e5;background:#fff;padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;color:#666;white-space:nowrap;transition:all .12s}
.pill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.sep{width:1px;background:#ece9e4;height:20px;flex-shrink:0}

/* Grid */
.grid-wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.count{font-size:12px;color:#aaa;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

/* Card tile — shows the actual card image */
.tile{border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.07);transition:transform .13s,box-shadow .13s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.11)}
.tile-img{width:100%;display:block;background:#ece9e4}
.tile-img img{width:100%;display:block;object-fit:cover}
.tile-bar{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tile-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:#f0ede6;padding:3px 8px;border-radius:4px;font-size:11px;color:#777}
.tile-share{background:none;border:none;color:#1a7340;font-size:12px;cursor:pointer;padding:3px 6px;border-radius:4px}
.tile-share:hover{background:#f0faf5}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#ccc;grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty p{font-size:13px;color:#bbb}

/* Upload modal — bottom sheet on mobile */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
@media(min-width:560px){.overlay{align-items:center}}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 18px 36px;max-height:90vh;overflow-y:auto;position:relative}
@media(min-width:560px){.sheet{border-radius:18px;padding:24px}}
.sheet-title{font-size:16px;font-weight:600;margin-bottom:4px}
.sheet-sub{font-size:12px;color:#aaa;margin-bottom:18px}
.close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;color:#ccc;cursor:pointer}

/* Drop zone */
.dz{border:2px dashed #ddd;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;background:#fafaf8;margin-bottom:16px;transition:border-color .12s}
.dz.drag,.dz:hover{border-color:#c8a96e}
.dz p{color:#999;font-size:13px;margin-top:6px}
.dz small{color:#ccc;font-size:11px}
.dz input{display:none}

/* Queue */
.queue{display:flex;flex-direction:column;gap:14px}

/* Single upload card */
.ucard{background:#f8f7f4;border-radius:14px;overflow:hidden}
.ucard-img-wrap{position:relative}
.ucard-img{width:100%;display:block;max-height:240px;object-fit:contain;background:#ece9e4}
.ucard-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;line-height:28px;text-align:center}
.ucard-tags{padding:12px 14px 0}
.ucard-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.utag{border:1.5px solid #ddd;background:#fff;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;color:#666;transition:all .12s;white-space:nowrap}
.utag.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.utag.price-tag.on{background:#c8a96e;border-color:#c8a96e;color:#fff}
.ulabel{font-size:10px;color:#bbb;font-weight:600;letter-spacing:.4px;margin-bottom:5px;text-transform:uppercase}
.ucard-save{margin:12px 14px 14px;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;width:calc(100% - 28px);display:block}
.ucard-save:hover{background:#333}

/* Batch save */
.batch-save{margin-top:14px;background:#1a1a1a;color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:none}
.batch-save.on{display:block}

/* Detail */
#detail{display:none}
#detail.on{display:block}
#pool.off{display:none}
.d-nav{background:#fff;padding:13px 18px;border-bottom:1px solid #ece9e4;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.d-back{background:none;border:none;font-size:14px;cursor:pointer;color:#666}
.d-wrap{max-width:500px;margin:0 auto;padding:20px 16px 40px}
.d-img{width:100%;border-radius:16px;display:block;margin-bottom:18px}
.d-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.d-tag{background:#f0ede6;padding:5px 12px;border-radius:20px;font-size:13px;color:#666}
.d-share{background:#1a7340;color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">Niko <em>·</em> 房源池</div>
  <button class="add-btn" onclick="openUpload()">＋ 上传</button>
</header>

<div class="filter-bar">
  <span class="fl">区域</span>
  <div style="display:flex;gap:5px">
    <button class="pill on" onclick="filt('zone','all',this)">全部</button>
    <button class="pill" onclick="filt('zone','1',this)">Z1</button>
    <button class="pill" onclick="filt('zone','2',this)">Z2</button>
    <button class="pill" onclick="filt('zone','3',this)">Z3</button>
  </div>
  <div class="sep"></div>
  <span class="fl">户型</span>
  <div style="display:flex;gap:5px">
    <button class="pill on" onclick="filt('beds','all',this)">全部</button>
    <button class="pill" onclick="filt('beds','0',this)">Studio</button>
    <button class="pill" onclick="filt('beds','1',this)">1室</button>
    <button class="pill" onclick="filt('beds','2',this)">2室</button>
    <button class="pill" onclick="filt('beds','3',this)">3室+</button>
  </div>
  <div class="sep"></div>
  <span class="fl">价格</span>
  <div style="display:flex;gap:5px">
    <button class="pill on" onclick="filt('price','all',this)">全部</button>
    <button class="pill" onclick="filt('price','low',this)">≤£700</button>
    <button class="pill" onclick="filt('price','mid',this)">£700-1000</button>
    <button class="pill" onclick="filt('price','high',this)">≥£1000</button>
  </div>
</div>

<div id="pool">
  <div class="grid-wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="detail">
  <div class="d-nav">
    <button class="d-back" onclick="showPool()">← 返回</button>
  </div>
  <div class="d-wrap" id="d-wrap"></div>
</div>

<!-- Upload sheet -->
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="sheet">
    <button class="close-x" onclick="closeUpload()">×</button>
    <div class="sheet-title">上传房源卡片</div>
    <div class="sheet-sub">选择图片，点选区域/户型/价格后保存</div>
    <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
      <div style="font-size:32px">📷</div>
      <p>点击选择图片（可多选）</p>
      <small>支持拖拽上传</small>
      <input type="file" id="fi" accept="image/*" multiple onchange="handleFiles(this.files)">
    </div>
    <div class="queue" id="queue"></div>
    <button class="batch-save" id="batch-save" onclick="saveAll()">全部保存到房源池</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ─────────────────────────────────────────────────
let F = {zone:'all', beds:'all', price:'all'};
let allProps = [];
let batchQ = []; // {id, objectUrl, dataUrl, zone, beds, price}

// Built-in 15 listings (kept as before, shown as metadata cards)
const BUILT_IN = [{"id":"1-boxwood-gardens-london-e1w","title":"1 Boxwood Gardens, London, E1W","postcode":"E1W","zone":2,"weekly":635,"monthly":2752,"bed_label":"1 Bed 1 Bath","beds":1,"avail":"24/07/2026","furnish":"带家具","images":["images/1-boxwood-gardens-london-e1w/img_1.jpg","images/1-boxwood-gardens-london-e1w/img_2.jpg","images/1-boxwood-gardens-london-e1w/img_3.jpg","images/1-boxwood-gardens-london-e1w/img_4.jpg"]},{"id":"stratosphere-tower-55-great-eastern-road-stratford-e15","title":"Stratosphere Tower, E15","postcode":"E15","zone":3,"weekly":646,"monthly":2799,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"05/08/2026","furnish":"带家具","images":["images/stratosphere-tower-55-great-eastern-road-stratford-e15/img_1.jpg","images/stratosphere-tower-55-great-eastern-road-stratford-e15/img_2.jpg","images/stratosphere-tower-55-great-eastern-road-stratford-e15/img_3.jpg","images/stratosphere-tower-55-great-eastern-road-stratford-e15/img_4.jpg"]},{"id":"regent-street-fitzrovia-w1b","title":"Regent Street, W1B","postcode":"W1B","zone":2,"weekly":725,"monthly":3142,"bed_label":"1 Bed 1 Bath","beds":1,"avail":"Now","furnish":"带家具","images":["images/regent-street-fitzrovia-w1b/img_1.jpg","images/regent-street-fitzrovia-w1b/img_2.jpg"]},{"id":"cube-building-17-21-wenlock-road-london-n1","title":"Cube Building, N1","postcode":"N1","zone":1,"weekly":750,"monthly":3250,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"23/05/2026","furnish":"带家具","images":["images/cube-building-17-21-wenlock-road-london-n1/img_1.jpg","images/cube-building-17-21-wenlock-road-london-n1/img_2.jpg","images/cube-building-17-21-wenlock-road-london-n1/img_3.jpg","images/cube-building-17-21-wenlock-road-london-n1/img_4.jpg"]},{"id":"damac-tower-nine-elms-london-sw8","title":"DAMAC Tower, SW8","postcode":"SW8","zone":2,"weekly":762,"monthly":3302,"bed_label":"1 Bed 1 Bath","beds":1,"avail":"29/07/2026","furnish":"带家具","images":["images/damac-tower-nine-elms-london-sw8/img_1.jpg","images/damac-tower-nine-elms-london-sw8/img_2.jpg","images/damac-tower-nine-elms-london-sw8/img_3.jpg","images/damac-tower-nine-elms-london-sw8/img_4.jpg"]},{"id":"sterling-mansions-75-leman-street-goodman-s-fields-aldgate-e1","title":"Sterling Mansions, E1","postcode":"E1","zone":1,"weekly":795,"monthly":3445,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"12/07/2026","furnish":"不带家具","images":["images/sterling-mansions-75-leman-street-goodman-s-fields-aldgate-e1/img_1.jpg","images/sterling-mansions-75-leman-street-goodman-s-fields-aldgate-e1/img_2.jpg","images/sterling-mansions-75-leman-street-goodman-s-fields-aldgate-e1/img_3.jpg","images/sterling-mansions-75-leman-street-goodman-s-fields-aldgate-e1/img_4.jpg"]},{"id":"asquith-house-segrave-walk-city-of-westminster-london","title":"Asquith House, W2","postcode":"W2","zone":2,"weekly":805,"monthly":3488,"bed_label":"1 Bed 1 Bath","beds":1,"avail":"09/09/2026","furnish":"带家具","images":["images/asquith-house-segrave-walk-city-of-westminster-london/img_1.jpg","images/asquith-house-segrave-walk-city-of-westminster-london/img_2.jpg","images/asquith-house-segrave-walk-city-of-westminster-london/img_3.jpg","images/asquith-house-segrave-walk-city-of-westminster-london/img_4.jpg"]},{"id":"dominion-house-59-bartholomew-close-farringdon-barbican-london-ec1a","title":"Dominion House, EC1A","postcode":"EC1A","zone":1,"weekly":808,"monthly":3501,"bed_label":"1 Bed 1 Bath","beds":1,"avail":"20/07/2026","furnish":"带家具","images":["images/dominion-house-59-bartholomew-close-farringdon-barbican-london-ec1a/img_1.jpg","images/dominion-house-59-bartholomew-close-farringdon-barbican-london-ec1a/img_2.jpg","images/dominion-house-59-bartholomew-close-farringdon-barbican-london-ec1a/img_3.jpg","images/dominion-house-59-bartholomew-close-farringdon-barbican-london-ec1a/img_4.jpg"]},{"id":"riverlight-four-riverlight-quay-london-sw11","title":"Riverlight Four, SW11","postcode":"SW11","zone":2,"weekly":850,"monthly":3683,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"05/08/2026","furnish":"带家具","images":["images/riverlight-four-riverlight-quay-london-sw11/img_1.jpg","images/riverlight-four-riverlight-quay-london-sw11/img_2.jpg","images/riverlight-four-riverlight-quay-london-sw11/img_3.jpg","images/riverlight-four-riverlight-quay-london-sw11/img_4.jpg"]},{"id":"hurlock-heights-deacon-street-southwark-london","title":"Hurlock Heights, SE17","postcode":"SE17","zone":2,"weekly":875,"monthly":3792,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"13/08/2026","furnish":"带家具","images":["images/hurlock-heights-deacon-street-southwark-london/img_1.jpg","images/hurlock-heights-deacon-street-southwark-london/img_2.jpg","images/hurlock-heights-deacon-street-southwark-london/img_3.jpg","images/hurlock-heights-deacon-street-southwark-london/img_4.jpg"]},{"id":"latitude-house-oval-road-camden-london-nw1","title":"Latitude House, NW1","postcode":"NW1","zone":1,"weekly":995,"monthly":4312,"bed_label":"2 Bed 1 Bath","beds":2,"avail":"04/07/2026","furnish":"不带家具","images":["images/latitude-house-oval-road-camden-london-nw1/img_1.jpg","images/latitude-house-oval-road-camden-london-nw1/img_2.jpg"]},{"id":"the-atlas-building-city-road-ec1v","title":"The Atlas Building, EC1V","postcode":"EC1V","zone":2,"weekly":1000,"monthly":4333,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"14/08/2026","furnish":"带家具","images":["images/the-atlas-building-city-road-ec1v/img_1.jpg","images/the-atlas-building-city-road-ec1v/img_2.jpg","images/the-atlas-building-city-road-ec1v/img_3.jpg","images/the-atlas-building-city-road-ec1v/img_4.jpg"]},{"id":"kensington-apartments-commercial-street-e1","title":"Kensington Apartments, E1","postcode":"E1","zone":1,"weekly":1025,"monthly":4442,"bed_label":"3 Bed 2 Bath","beds":3,"avail":"23/07/2026","furnish":"带家具","images":["images/kensington-apartments-commercial-street-e1/img_1.jpg","images/kensington-apartments-commercial-street-e1/img_2.jpg","images/kensington-apartments-commercial-street-e1/img_3.jpg","images/kensington-apartments-commercial-street-e1/img_4.jpg"]},{"id":"jubilee-walk-clerkenwell-holborn-wc1x","title":"Jubilee Walk, WC1X","postcode":"WC1X","zone":2,"weekly":1154,"monthly":5001,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"10/08/2026","furnish":"带家具","images":["images/jubilee-walk-clerkenwell-holborn-wc1x/img_1.jpg","images/jubilee-walk-clerkenwell-holborn-wc1x/img_2.jpg","images/jubilee-walk-clerkenwell-holborn-wc1x/img_3.jpg","images/jubilee-walk-clerkenwell-holborn-wc1x/img_4.jpg"]},{"id":"morwell-street-london-wc1b","title":"Morwell Street, WC1B","postcode":"WC1B","zone":2,"weekly":1650,"monthly":7150,"bed_label":"2 Bed 2 Bath","beds":2,"avail":"20/07/2026","furnish":"带家具","images":["images/morwell-street-london-wc1b/img_1.jpg","images/morwell-street-london-wc1b/img_2.jpg"]}];

function priceRange(w) {
  if (!w) return 'unknown';
  if (w <= 700) return 'low';
  if (w <= 1000) return 'mid';
  return 'high';
}

function loadAll() {
  const saved = JSON.parse(localStorage.getItem('niko-cards') || '[]');
  allProps = [...saved, ...BUILT_IN.map(p => ({
    ...p, isBuiltIn: true,
    price: priceRange(p.weekly),
    displayImg: p.images[0]
  }))];
  render();
}

function getFiltered() {
  return allProps.filter(p => {
    if (F.zone !== 'all' && String(p.zone) !== F.zone) return false;
    if (F.beds !== 'all') {
      const b = parseInt(F.beds);
      if (b === 3 && p.beds < 3) return false;
      if (b < 3 && p.beds !== b) return false;
    }
    if (F.price !== 'all' && p.price !== F.price) return false;
    return true;
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('count').textContent = `共 ${list.length} 套`;
  const g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty"><div class="empty-icon">🏠</div><p>没有符合条件的房源</p></div>';
    return;
  }
  g.innerHTML = list.map(p => {
    const img = p.displayImg || (p.images && p.images[0]);
    const zoneLabel = p.zone ? `Z${p.zone}` : '';
    const bedsLabel = p.beds === 0 ? 'Studio' : (p.beds || 2) + '室';
    const priceLabel = p.weekly ? `£${p.weekly}/周` : '';
    return `<div class="tile" onclick="showDetail('${p.id}')">
      <div class="tile-img">
        ${img ? `<img src="${img}" loading="lazy" onerror="this.parentNode.style.minHeight='120px'">` : '<div style="min-height:140px;background:#ece9e4"></div>'}
      </div>
      <div class="tile-bar">
        <div class="tile-tags">
          ${zoneLabel ? `<span class="tag">${zoneLabel}</span>` : ''}
          <span class="tag">${bedsLabel}</span>
          ${priceLabel ? `<span class="tag">${priceLabel}</span>` : ''}
        </div>
        <button class="tile-share" onclick="event.stopPropagation();share('${p.id}')">↗</button>
      </div>
    </div>`;
  }).join('');
}

function filt(type, val, el) {
  F[type] = val;
  el.parentNode.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  render();
}

// ── DETAIL ───────────────────────────────────────────────
function showDetail(id) {
  const p = allProps.find(x => x.id === id);
  if (!p) return;
  const img = p.displayImg || (p.images && p.images[0]);
  const bedsLabel = p.beds === 0 ? 'Studio' : (p.beds || 2) + '室';
  document.getElementById('d-wrap').innerHTML = `
    ${img ? `<img class="d-img" src="${img}">` : ''}
    <div class="d-tags">
      ${p.zone ? `<span class="d-tag">Zone ${p.zone}</span>` : ''}
      <span class="d-tag">${bedsLabel}</span>
      ${p.weekly ? `<span class="d-tag">£${p.weekly}/周</span>` : ''}
      ${p.avail ? `<span class="d-tag">${p.avail}</span>` : ''}
      ${p.furnish ? `<span class="d-tag">${p.furnish}</span>` : ''}
      ${p.postcode ? `<span class="d-tag">${p.postcode}</span>` : ''}
    </div>
    ${p.title ? `<p style="font-size:14px;color:#888;margin-bottom:18px">${p.title}</p>` : ''}
    <button class="d-share" onclick="share('${p.id}')">↗ 复制分享链接</button>
    ${!p.isBuiltIn ? `<button onclick="deleteCard('${p.id}')" style="margin-top:10px;width:100%;padding:12px;border:1.5px solid #eee;border-radius:12px;background:#fff;color:#c0392b;font-size:13px;cursor:pointer">删除这条房源</button>` : ''}
  `;
  document.getElementById('pool').classList.add('off');
  document.getElementById('detail').classList.add('on');
  history.pushState(null, '', '#/p/' + id);
}

function showPool() {
  document.getElementById('pool').classList.remove('off');
  document.getElementById('detail').classList.remove('on');
  history.pushState(null, '', location.pathname);
}

function deleteCard(id) {
  if (!confirm('确定删除这条房源吗？')) return;
  const saved = JSON.parse(localStorage.getItem('niko-cards') || '[]');
  const updated = saved.filter(x => x.id !== id);
  localStorage.setItem('niko-cards', JSON.stringify(updated));
  loadAll();
  showPool();
  toast('已删除');
}

function share(id) {
  const url = location.origin + location.pathname + '#/p/' + id;
  navigator.clipboard.writeText(url)
    .then(() => toast('链接已复制 ✓'))
    .catch(() => { prompt('复制此链接：', url); });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2000);
}

// ── UPLOAD ───────────────────────────────────────────────
function openUpload() {
  document.getElementById('overlay').classList.add('on');
}
function closeUpload() {
  document.getElementById('overlay').classList.remove('on');
  batchQ = [];
  document.getElementById('queue').innerHTML = '';
  document.getElementById('batch-save').classList.remove('on');
  document.getElementById('fi').value = '';
}
function bgClick(e) {
  if (e.target === document.getElementById('overlay')) closeUpload();
}

const dz = document.getElementById('dz');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  arr.forEach(file => {
    const id = 'u' + Date.now() + Math.random().toString(36).slice(2,5);
    const objectUrl = URL.createObjectURL(file);
    const entry = { id, file, objectUrl, dataUrl: null, zone: null, beds: null, price: null };
    batchQ.push(entry);
    appendCard(entry);
    // Also load a compressed dataUrl for saving
    compressForSave(file).then(du => { entry.dataUrl = du; });
  });
  if (batchQ.length > 1) document.getElementById('batch-save').classList.add('on');
}

function compressForSave(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
          else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(ev.target.result);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function appendCard(entry) {
  const qEl = document.getElementById('queue');
  const div = document.createElement('div');
  div.className = 'ucard'; div.id = entry.id;

  div.innerHTML = `
    <div class="ucard-img-wrap">
      <img class="ucard-img" src="${entry.objectUrl}" onerror="this.style.display='none'">
      <button class="ucard-del" onclick="removeCard('${entry.id}')">×</button>
    </div>
    <div class="ucard-tags">
      <div class="ulabel">区域 / Zone</div>
      <div class="ucard-tags-row">
        <button class="utag" onclick="tagSelect('${entry.id}','zone','1',this)">Zone 1</button>
        <button class="utag" onclick="tagSelect('${entry.id}','zone','2',this)">Zone 2</button>
        <button class="utag" onclick="tagSelect('${entry.id}','zone','3',this)">Zone 3</button>
      </div>
      <div class="ulabel">户型</div>
      <div class="ucard-tags-row">
        <button class="utag" onclick="tagSelect('${entry.id}','beds','0',this)">Studio</button>
        <button class="utag" onclick="tagSelect('${entry.id}','beds','1',this)">1室</button>
        <button class="utag" onclick="tagSelect('${entry.id}','beds','2',this)">2室</button>
        <button class="utag" onclick="tagSelect('${entry.id}','beds','3',this)">3室+</button>
      </div>
      <div class="ulabel">价格范围</div>
      <div class="ucard-tags-row">
        <button class="utag price-tag" onclick="tagSelect('${entry.id}','price','low',this)">≤£700/周</button>
        <button class="utag price-tag" onclick="tagSelect('${entry.id}','price','mid',this)">£700-1000</button>
        <button class="utag price-tag" onclick="tagSelect('${entry.id}','price','high',this)">≥£1000/周</button>
      </div>
    </div>
    <button class="ucard-save" onclick="saveSingle('${entry.id}')">保存到房源池</button>
  `;
  qEl.appendChild(div);
}

function tagSelect(id, key, val, el) {
  const entry = batchQ.find(x => x.id === id);
  if (entry) entry[key] = parseInt(val) || val;
  // Deselect siblings
  el.closest('.ucard-tags-row').querySelectorAll('.utag').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function removeCard(id) {
  const entry = batchQ.find(x => x.id === id);
  if (entry && entry.objectUrl) URL.revokeObjectURL(entry.objectUrl);
  batchQ = batchQ.filter(x => x.id !== id);
  document.getElementById(id)?.remove();
  if (batchQ.length <= 1) document.getElementById('batch-save').classList.remove('on');
}

function saveSingle(id) {
  const entry = batchQ.find(x => x.id === id);
  if (!entry) return;
  const p = {
    id: 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2,5),
    isUploaded: true,
    zone: entry.zone || 2,
    beds: entry.beds != null ? entry.beds : 2,
    price: entry.price || 'mid',
    weekly: entry.price === 'low' ? 650 : entry.price === 'high' ? 1100 : 850,
    displayImg: entry.dataUrl || entry.objectUrl,
    uploadedAt: new Date().toISOString()
  };
  const saved = JSON.parse(localStorage.getItem('niko-cards') || '[]');
  saved.unshift(p);
  localStorage.setItem('niko-cards', JSON.stringify(saved));
  allProps.unshift({...p});
  render();
  removeCard(id);
  if (!batchQ.length) closeUpload();
  toast('已保存 ✓');
}

function saveAll() {
  const ids = batchQ.map(x => x.id);
  ids.forEach(id => saveSingle(id));
}

// ── ROUTING ──────────────────────────────────────────────
window.addEventListener('popstate', () => {
  if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
  else showPool();
});

loadAll();
if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
</script>
