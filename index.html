<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#e8e4dc;color:#1a1a1a}

/* ── DESKTOP CENTERING ── */
body{display:flex;justify-content:center;align-items:flex-start}
.page-wrap{width:100%;max-width:480px;min-height:100vh;background:#f0ede6;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.18)}

/* ── HEADER ── */
.header{background:#1a1a1a;padding:14px 16px 0;position:sticky;top:0;z-index:100;flex-shrink:0}
.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.brand-left{display:flex;align-items:center;gap:10px;min-width:0}

/* Logo mark */
.brand-logo{width:34px;height:34px;background:#c9a96e;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo-n{color:#1a1a1a;font-size:18px;font-weight:800;line-height:1;letter-spacing:-.02em;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

.brand-text{min-width:0}
.brand-name{color:#fff;font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand-sub{color:rgba(255,255,255,.38);font-size:9.5px;letter-spacing:.13em;margin-top:2px;white-space:nowrap}

/* WeChat header button */
.wechat-btn-header{display:flex;align-items:center;gap:5px;background:rgba(7,193,96,.15);border:0.5px solid rgba(7,193,96,.45);border-radius:20px;padding:6px 11px;cursor:pointer;flex-shrink:0;transition:background .15s;outline:none}
.wechat-btn-header:active{background:rgba(7,193,96,.3)}
.wechat-btn-header svg{flex-shrink:0;color:#07c160}
.wechat-btn-header span{color:#07c160;font-size:11.5px;font-weight:500;white-space:nowrap}

/* Search */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none}
.search-input{width:100%;padding:10px 12px 10px 36px;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;-webkit-appearance:none}
.search-input::placeholder{color:rgba(255,255,255,.35)}
.search-input:focus{background:rgba(255,255,255,.15);border-color:rgba(201,169,110,.5)}

/* Filter chips */
.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 13px;border-radius:20px;border:0.5px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;outline:none}
.chip.active{background:#c9a96e;border-color:#c9a96e;color:#1a1a1a;font-weight:600}

/* Sort row — inside sticky header */
.sort-row{display:flex;align-items:center;gap:6px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none;border-top:0.5px solid rgba(255,255,255,.08);padding-top:9px}
.sort-row::-webkit-scrollbar{display:none}
.count{font-size:11px;color:rgba(255,255,255,.35);flex-shrink:0;margin-right:2px}
.sort-chip{flex-shrink:0;padding:4px 12px;border-radius:20px;border:0.5px solid rgba(255,255,255,.18);background:transparent;font-size:11px;color:rgba(255,255,255,.55);cursor:pointer;white-space:nowrap;outline:none;transition:all .15s}
.sort-chip.active{background:rgba(201,169,110,.22);border-color:rgba(201,169,110,.7);color:#c9a96e;font-weight:500}

/* ── LISTING CARDS ── */
.listings{padding:10px 12px 100px;flex:1}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.07)}

/* Hero image */
.hero{width:100%;height:200px;background:#1a2744;position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.hero-placeholder svg{opacity:.15}
.badge-zone{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;font-size:10px;padding:3px 9px;border-radius:20px;letter-spacing:.06em}
.badge-avail{position:absolute;top:10px;right:10px;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500}
.avail-now{background:rgba(26,102,64,.9);color:#fff}
.avail-soon{background:rgba(255,255,255,.92);color:#1a6640}
.avail-later{background:rgba(255,255,255,.85);color:#666}

/* Thumbnails */
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:64px}
.thumbs img,.thumb-ph{width:100%;height:100%;object-fit:cover;display:block;background:#e8e3da}

/* Card body */
.card-body{padding:14px 14px 10px}
.card-pc{font-size:10px;letter-spacing:.2em;color:#c9a96e;font-weight:500;margin-bottom:3px;text-transform:uppercase}
.card-title{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:12px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.spec{text-align:center;padding:8px 4px;background:#f7f4ef;border-radius:8px}
.spec-icon{font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.spec-val{display:block;font-size:11px;font-weight:600;margin-top:2px;line-height:1.2}
.spec-lbl{display:block;font-size:9px;color:#999;margin-top:1px;letter-spacing:.04em}
.price-row{display:flex;align-items:baseline;gap:4px;margin-bottom:9px}
.price-wk{font-size:24px;font-weight:700;letter-spacing:-.5px}
.price-unit{font-size:12px;color:#999}
.price-mo{font-size:11px;color:#aaa;margin-left:auto}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:2px}
.tag{font-size:10px;padding:3px 8px;border-radius:5px;background:#f7f4ef;border:0.5px solid #e8e3da;color:#6b5c45}

/* Card footer */
.card-footer{border-top:0.5px solid #f0ede6;padding:11px 14px;display:flex;align-items:center;gap:10px}
.btn-contact{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;background:#07c160;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;outline:none;transition:background .15s}
.btn-contact:active{background:#06a852}
.btn-contact svg{flex-shrink:0}
.btn-save{width:40px;height:40px;border-radius:10px;border:0.5px solid #ddd;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#bbb;flex-shrink:0;transition:all .15s;outline:none}
.btn-save.saved{color:#c9a96e;border-color:#c9a96e}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:#aaa}
.empty svg{margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* ── WECHAT MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:8px 20px 40px;width:100%;max-width:480px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#e0ddd7;border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:5px}
.modal-sub{font-size:13px;color:#999;text-align:center;margin-bottom:20px;line-height:1.5}
.modal-prop{font-size:12px;color:#c9a96e;text-align:center;margin-bottom:18px;font-weight:500;letter-spacing:.04em}

.wechat-id-left{}

.wechat-id-val{font-size:22px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
.btn-copy{padding:9px 20px;background:#07c160;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;outline:none;flex-shrink:0}

.modal-steps{background:#f7f4ef;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.modal-steps-title{font-size:11px;color:#aaa;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.modal-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.modal-step:last-child{margin-bottom:0}
.step-num{width:18px;height:18px;background:#07c160;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-num span{color:#fff;font-size:10px;font-weight:700}
.step-text{font-size:12px;color:#555;line-height:1.5}
.modal-close{display:block;width:100%;padding:13px;background:#f0ede6;border:none;border-radius:12px;font-size:14px;color:#666;cursor:pointer;font-weight:500;outline:none}
.modal-close:active{background:#e5e1d8}
</style>

function loadData() {
  DATA = (INLINE_DATA.listings || []).filter(d => d.active);
  buildFilters();
  render();
}

function buildFilters() {
  const postcodes = [...new Set(DATA.map(d => d.postcode))].sort();
  document.getElementById('zoneRow').innerHTML =
    `<span class="chip active" onclick="setPostcode('all',this)">全部</span>` +
    postcodes.map(p => `<span class="chip" onclick="setPostcode('${p}',this)">${p}</span>`).join('');

  const bedMap = {};
  DATA.forEach(d => { bedMap[d.beds] = d.bed_label; });
  const bedKeys = Object.keys(bedMap).map(Number).sort((a,b) => a - b);
  document.getElementById('bedRow').innerHTML =
    `<span class="chip active" onclick="setBed('all',this)">全部户型</span>` +
    bedKeys.map(b => `<span class="chip" onclick="setBed(${b},this)">${b === 0 ? 'Studio' : b + '室'}</span>`).join('');
}

function setPostcode(v, el) {
  activePostcode = v;
  document.querySelectorAll('#zoneRow .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}
function setBed(v, el) {
  activeBed = v;
  document.querySelectorAll('#bedRow .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}
function setSort(v, el) {
  sortMode = v;
  document.querySelectorAll('.sort-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function parseAvailDate(avail) {
  if (!avail || avail === '—') return new Date('2099-01-01');
  if (avail === 'Now') return new Date('2000-01-01');
  const p = avail.split('/');
  if (p.length === 3) return new Date(+p[2], +p[1] - 1, +p[0]);
  return new Date('2099-01-01');
}

// Chinese date format: 8月5日入住
function availBadge(avail) {
  if (!avail || avail === '—') return { text: '待确认', cls: 'avail-later' };
  if (avail === 'Now') return { text: '可即入住', cls: 'avail-now' };
  const p = avail.split('/');
  if (p.length === 3) {
    const d = new Date(+p[2], +p[1] - 1, +p[0]);
    const diff = (d - new Date()) / 86400000;
    const dateStr = `${+p[1]}月${+p[0]}日入住`;
    if (diff < 0) return { text: '可即入住', cls: 'avail-now' };
    if (diff < 60) return { text: dateStr, cls: 'avail-soon' };
    return { text: dateStr, cls: 'avail-later' };
  }
  return { text: avail, cls: 'avail-later' };
}

// Spec display label for avail
function availShort(avail) {
  if (!avail || avail === '—') return '—';
  if (avail === 'Now') return '即刻';
  const p = avail.split('/');
  if (p.length === 3) {
    const d = new Date(+p[2], +p[1] - 1, +p[0]);
    if ((d - new Date()) / 86400000 < 0) return '即刻';
    return `${+p[1]}月${+p[0]}日`;
  }
  return avail;
}

function bedIcon(beds) {
  return beds === 0
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21v-4M16 21v-4M2 17h20"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 16h20"/><path d="M6 8v-4M18 11V8a2 2 0 0 0-2-2h-4"/></svg>';
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = DATA.filter(d => {
    if (activePostcode !== 'all' && d.postcode !== activePostcode) return false;
    if (activeBed !== 'all' && d.beds !== activeBed) return false;
    if (q && ![d.title, d.address, d.postcode].some(s => s && s.toLowerCase().includes(q))) return false;
    return true;
  });

  if (sortMode === 'price-asc') list.sort((a, b) => a.weekly - b.weekly);
  else if (sortMode === 'price-desc') list.sort((a, b) => b.weekly - a.weekly);
  else list.sort((a, b) => parseAvailDate(a.avail) - parseAvailDate(b.avail));

    return `<div class="card">
  <div class="hero">
    ${hero}

        </div>
        <span class="spec-val">${d.postcode}</span>
        <span class="spec-lbl">邮编</span>
      </div>
      <div class="spec">
        <div class="spec-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <span class="spec-val" style="font-size:9px;line-height:1.3">${availShort(d.avail)}</span>
        <span class="spec-lbl">入住</span>

function toggleSave(id, btn) {
  if (saved.has(id)) saved.delete(id); else saved.add(id);
  render();
}

// ── MODAL ──
function openModal(listingId) {
  const propEl = document.getElementById('modalPropName');
  if (listingId) {
    const d = DATA.find(x => x.id === listingId);
    propEl.textContent = d ? `房源：${d.title}` : '';
  } else {
    propEl.textContent = '';
  }
  document.getElementById('copyBtn').textContent = '复制';
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('wechatModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('wechatModal').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('wechatModal')) closeModal();
}

function copyWechat() {
  const btn = document.getElementById('copyBtn');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(WECHAT_ID).then(() => {
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2500);
    });
  } else {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = WECHAT_ID;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2500);
  }
}
